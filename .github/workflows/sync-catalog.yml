name: 应用总表自动抓取

on:
  push:
    branches:
      - main
    paths:
      - data/catalog-config.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appstore-price-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 读取应用总表与当前数据
        uses: actions/checkout@v6

      - name: 使用 Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: 安装构建依赖
        run: npm ci

      - name: 保留更新前快照
        run: |
          mkdir -p .tmp
          cp data/validation-snapshot.json .tmp/catalog-before.json

      - name: 分批抓取总表新增或特殊地区数据
        run: npm run data:add

      - name: 生成本次变化摘要
        id: compare
        run: node scripts/compare-price-snapshots.mjs --before .tmp/catalog-before.json --after data/validation-snapshot.json --json .tmp/catalog-diff.json --markdown .tmp/catalog-diff.md --github-output "$GITHUB_OUTPUT"

      - name: 生成线上部署标记
        run: node scripts/write-deployment-marker.mjs

      - name: 验证数据与静态网站
        run: npm test

      - name: 写入任务摘要
        run: |
          node scripts/render-update-report.mjs data/validation-snapshot.json >> "$GITHUB_STEP_SUMMARY"
          cat .tmp/catalog-diff.md >> "$GITHUB_STEP_SUMMARY"

      - name: 提交自动生成的数据
        id: commit
        run: |
          git diff --check
          git add data/validation-snapshot.json data/exchange-rates.json data/price-change-log.json public/deployment-status.json
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync apps from catalog"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: 验证 Cloudflare 线上部署
        if: steps.commit.outputs.published == 'true'
        env:
          SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://price.290935.xyz' }}
        run: node scripts/verify-public-deployment.mjs --url "$SITE_URL" --timeout-seconds 600

      - name: 发送 Bark 发布结果
        if: success() && steps.commit.outputs.published == 'true' && steps.compare.outputs.changed == 'true'
        continue-on-error: true
        env:
          BARK_PUSH_URL: ${{ secrets.BARK_PUSH_URL }}
          SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://price.290935.xyz' }}
        run: node scripts/notify-bark.mjs --event published --summary .tmp/catalog-diff.json --url "${SITE_URL%/}/changes/"

      - name: 任务失败时发送 Bark
        if: failure()
        continue-on-error: true
        env:
          BARK_PUSH_URL: ${{ secrets.BARK_PUSH_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notify-bark.mjs --event failure --url "$RUN_URL"
