name: 更新订阅比价参考汇率

on:
  schedule:
    - cron: "10 7 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appstore-price-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 读取当前数据
        uses: actions/checkout@v6

      - name: 使用 Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: 抓取当天参考汇率
        run: node scripts/fetch-exchange-rates.mjs --output .tmp/exchange-rates.json

      - name: 更新汇率与部署标记
        run: |
          cp .tmp/exchange-rates.json data/exchange-rates.json
          node scripts/write-deployment-marker.mjs

      - name: 提交汇率
        id: commit
        run: |
          git diff --check
          git add data/exchange-rates.json public/deployment-status.json
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh subscription comparison exchange rates"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: 验证 Cloudflare 线上部署
        if: steps.commit.outputs.published == 'true'
        env:
          SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://price.290935.xyz' }}
        run: node scripts/verify-public-deployment.mjs --url "$SITE_URL" --timeout-seconds 600

      - name: 任务失败时发送 Bark
        if: failure()
        continue-on-error: true
        env:
          BARK_PUSH_URL: ${{ secrets.BARK_PUSH_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notify-bark.mjs --event failure --url "$RUN_URL"
