name: 手动更新 App Store 价格

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appstore-price-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 读取当前数据
        uses: actions/checkout@v6

      - name: 使用 Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: 抓取候选快照
        run: node scripts/fetch-price-snapshot.mjs --output .tmp/price-snapshot.json --fallback data/validation-snapshot.json

      - name: 校验候选快照
        run: node scripts/validate-price-snapshot.mjs --snapshot .tmp/price-snapshot.json --previous data/validation-snapshot.json

      - name: 生成变化报告
        id: compare
        run: node scripts/compare-price-snapshots.mjs --before data/validation-snapshot.json --after .tmp/price-snapshot.json --json .tmp/price-diff.json --markdown .tmp/price-diff.md --github-output "$GITHUB_OUTPUT"

      - name: 更新价格与汇率文件
        run: |
          cp .tmp/price-snapshot.json data/validation-snapshot.json
          node scripts/fetch-exchange-rates.mjs --output data/exchange-rates.json

      - name: 更新网站价格日志
        run: node scripts/update-price-change-log.mjs --diff .tmp/price-diff.json --log data/price-change-log.json

      - name: 安装构建依赖
        run: npm ci

      - name: 验证静态网站
        run: npm test

      - name: 写入任务摘要
        run: |
          node scripts/render-update-report.mjs data/validation-snapshot.json >> "$GITHUB_STEP_SUMMARY"
          cat .tmp/price-diff.md >> "$GITHUB_STEP_SUMMARY"

      - name: 提交最新数据
        id: commit
        run: |
          git diff --check
          git add data/validation-snapshot.json data/exchange-rates.json data/price-change-log.json
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update App Store price snapshot"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: 发送 Bark 发布结果
        if: success()
        env:
          BARK_PUSH_URL: ${{ secrets.BARK_PUSH_URL }}
          SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://price.290935.xyz' }}
        run: node scripts/notify-bark.mjs --event published --summary .tmp/price-diff.json --url "${SITE_URL%/}/changes/"

      - name: 任务失败时发送 Bark
        if: failure()
        env:
          BARK_PUSH_URL: ${{ secrets.BARK_PUSH_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notify-bark.mjs --event failure --url "$RUN_URL"
