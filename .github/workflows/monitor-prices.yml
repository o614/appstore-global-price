name: 检测并发布 App Store 订阅变动

on:
  schedule:
    - cron: "37 6,14,22 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appstore-price-data
  cancel-in-progress: false

jobs:
  detect-confirm-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 读取当前数据
        uses: actions/checkout@v6

      - name: 使用 Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: 分组抓取并确认价格
        run: node scripts/fetch-confirmed-price-batches.mjs --output .tmp/price-snapshot-confirmed.json --fallback data/validation-snapshot.json --batch-size 3 --confirmation-delay-seconds 480

      - name: 校验合并快照
        run: node scripts/validate-price-snapshot.mjs --snapshot .tmp/price-snapshot-confirmed.json --previous data/validation-snapshot.json

      - name: 比较已确认订阅变动
        id: compare
        run: node scripts/compare-price-snapshots.mjs --before data/validation-snapshot.json --after .tmp/price-snapshot-confirmed.json --json .tmp/price-diff-confirmed.json --markdown .tmp/price-diff-confirmed.md --github-output "$GITHUB_OUTPUT"

      - name: 写入分组检测摘要
        run: |
          node scripts/render-update-report.mjs .tmp/price-snapshot-confirmed.json >> "$GITHUB_STEP_SUMMARY"
          cat .tmp/price-diff-confirmed.md >> "$GITHUB_STEP_SUMMARY"

      - name: 准备已验证数据
        id: publish-data
        run: |
          cp .tmp/price-snapshot-confirmed.json data/validation-snapshot.json
          if [ "${{ steps.compare.outputs.changed }}" = "true" ]; then
            node scripts/update-price-change-log.mjs --diff .tmp/price-diff-confirmed.json --log data/price-change-log.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          node scripts/fetch-exchange-rates.mjs --output data/exchange-rates.json
          node scripts/write-deployment-marker.mjs
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: 安装构建依赖
        if: steps.publish-data.outputs.ready == 'true'
        run: npm ci

      - name: 验证数据与静态网站
        if: steps.publish-data.outputs.ready == 'true'
        run: |
          npm run lint
          npm test

      - name: 写入确认结果摘要
        if: steps.compare.outputs.changed == 'true'
        run: |
          printf '\n## 二次确认结果\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat .tmp/price-diff-confirmed.md >> "$GITHUB_STEP_SUMMARY"

      - name: 提交已确认数据
        if: steps.publish-data.outputs.ready == 'true'
        id: commit
        run: |
          git diff --check
          git add data/validation-snapshot.json data/exchange-rates.json data/price-change-log.json public/deployment-status.json
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh verified App Store price snapshot"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: 验证 Cloudflare 线上部署
        if: steps.commit.outputs.published == 'true'
        env:
          SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://price.290935.xyz' }}
        run: node scripts/verify-public-deployment.mjs --url "$SITE_URL" --timeout-seconds 600

      - name: 发送 Bark 上线结果
        if: steps.commit.outputs.published == 'true' && steps.publish-data.outputs.changed == 'true' && success()
        continue-on-error: true
        env:
          BARK_PUSH_URL: ${{ secrets.BARK_PUSH_URL }}
          SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://price.290935.xyz' }}
        run: node scripts/notify-bark.mjs --event published --summary .tmp/price-diff-confirmed.json --url "${SITE_URL%/}/changes/"

      - name: 保存检测与确认详情
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: price-batches-${{ github.run_id }}
          path: |
            .tmp/price-diff-confirmed.md
            .tmp/price-diff-confirmed.json
            .tmp/price-snapshot-confirmed.json
          if-no-files-found: ignore
          retention-days: 7

      - name: 任务失败时发送 Bark
        if: failure()
        continue-on-error: true
        env:
          BARK_PUSH_URL: ${{ secrets.BARK_PUSH_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notify-bark.mjs --event failure --url "$RUN_URL"
